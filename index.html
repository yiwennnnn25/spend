<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f7eaed">
<link rel="apple-touch-icon" href="expense_icon.png">
<link rel="icon" href="expense_icon.png">
<title>Spend</title>
<style>
  :root{
    --bg:#f7eaed; --card:#fdf8f5; --card2:#f1e2e5; --line:#ecdade;
    --ink:#4c3c41; --ink2:#8c7980; --ink3:#c2adb3;
    --mint:#c98bb8; --mint-bg:#f4e6f4; --grad:linear-gradient(135deg,#e39ab4,#c79ad8); --bar:linear-gradient(90deg,#c3b1f3,#e9a9d9 45%,#f2adc4 65%,#f8e08e); --peach:#d68a6e; --blush:#cf6f86; --lav:#c78a9e;
    --need:#5a9e7e; --need-bg:#e9f2ec; --want:#d4836c; --want-bg:#fbe9e1;
    --shadow:0 1px 2px rgba(120,80,95,.06),0 2px 6px rgba(120,80,95,.05);
    --pad:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-feature-settings:"tnum" 1;overscroll-behavior:none}
  body{display:flex;flex-direction:column;max-width:520px;margin:0 auto;min-height:100%}
  .num{font-variant-numeric:tabular-nums}

  /* The month card: what's gone, a shiny bar against the budget with a tick
     for where today "should" be, and today / left as two quiet ends. */
  header{position:relative;margin:8px 14px 0;padding:11px 16px 12px;border-radius:20px;cursor:pointer;
    background:linear-gradient(150deg,#fdf1f5,#f5ebfb 60%,#fdf5e8);border:1px solid #f0d9e4;box-shadow:var(--shadow);overflow:hidden}
  header:active{transform:scale(.99)}
  .htop{display:flex;align-items:baseline;justify-content:space-between}
  .month{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--lav);font-weight:700}
  .hday{font-size:11px;color:var(--ink2);font-weight:600}
  .mtot{font-size:32px;font-weight:700;margin-top:2px;letter-spacing:-1px;color:var(--ink);text-align:left;line-height:1.1}
  .mtot small{font-size:.5em;color:var(--ink3);font-weight:600;margin-right:4px;letter-spacing:0}
  .bar{position:relative;height:9px;background:rgba(255,255,255,.75);border-radius:6px;margin:9px 0 0;overflow:visible}
  .bar > i{position:relative;display:block;height:100%;background:var(--bar);width:0;border-radius:6px;transition:width .4s,background .3s;overflow:hidden}
  .bar > i::after{content:'';position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.75) 50%,transparent 70%);
    background-size:220% 100%;animation:sheen 3.6s ease-in-out infinite}
  @keyframes sheen{0%{background-position:130% 0}60%,100%{background-position:-90% 0}}
  .bar .tick{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;border-radius:2px;background:var(--ink3);opacity:.7}
  .bar .tip{position:absolute;top:50%;margin:-7px 0 0 -5px;font-size:10px;color:#e9a9d9;animation:tw 2.8s ease-in-out infinite;pointer-events:none}
  .hfoot{display:flex;justify-content:space-between;align-items:center;margin-top:7px;font-size:12px;color:var(--ink2)}
  .hfoot b{color:var(--ink);font-weight:700}
  .hfoot .hst{font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px}
  .hst.ok{background:var(--need-bg);color:var(--need)} .hst.hot{background:var(--want-bg);color:var(--want)} .hst.over{background:#fbe3e8;color:var(--blush)}
  .hset{color:var(--lav);font-weight:700}

  .amt{font-size:38px;font-weight:700;text-align:center;padding:2px 0 12px;letter-spacing:-1.5px;min-height:42px;color:var(--ink)}
  .amt small{font-size:20px;color:var(--ink3);font-weight:600;margin-right:5px}
  .amt.zero{color:var(--ink3)}


  .pop{position:fixed;left:50%;top:36%;font-size:22px;pointer-events:none;z-index:50;animation:pop .7s ease-out forwards}
  @keyframes pop{from{transform:translate(0,0) scale(.6);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(1.3);opacity:0}}

  .toggles{display:flex;flex-direction:column;gap:6px;padding:0 16px 7px}
  .seg{display:flex;background:var(--card2);border-radius:13px;padding:3px;gap:3px}
  .seg button{flex:1;border:0;background:transparent;color:var(--ink2);font-size:13px;font-weight:600;
    padding:8px 4px;border-radius:10px;transition:.15s;cursor:pointer}
  .seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
  .seg.need button.on[data-v="need"]{color:var(--need);background:var(--need-bg)}
  .seg.need button.on[data-v="want"]{color:var(--want);background:var(--want-bg)}
  button:focus{outline:none}

  .cat-ph{visibility:hidden}
  .note{display:block;width:calc(100% - 32px);margin:8px 16px 2px;background:var(--card);
    border:1px solid var(--line);box-shadow:var(--shadow);border-radius:12px;
    padding:9px 13px;font-size:13px;color:var(--ink);outline:none}
  .note::placeholder{color:var(--ink3)}
  .note:focus{border-color:var(--lav)}
  .cats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:0 16px}
  .cat{background:var(--card);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);
    padding:9px 5px;display:flex;flex-direction:column;align-items:center;gap:3px;
    color:var(--ink);font-size:12px;font-weight:600;transition:transform .08s,background .12s;cursor:pointer}
  .cat:active{transform:scale(.93);background:var(--mint-bg)}
  .cat .e{font-size:21px;line-height:1}
  .cat.flash{background:var(--grad);color:#fff;border-color:#d9a3c6}
  .cats.g4{grid-template-columns:repeat(4,1fr)}
  .cats.subs{grid-template-columns:repeat(2,1fr)}
  .cat{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  body.st-cat .cats{touch-action:none} /* iOS would otherwise claim a held-then-moved finger as a pan */
  .cats.dragging .cat:not(.lift){opacity:.75}
  .cat.lift{transform:scale(1.07);box-shadow:0 10px 26px rgba(150,100,150,.28);border-color:#d9a3c6;z-index:2;position:relative}
  body.st-cat .cats.subs .cat{flex-direction:row;justify-content:flex-start;padding:0 16px;gap:12px;text-align:left}
  .cats.subs .cat{background:linear-gradient(160deg,#fbeef6,#f1e4fa);border-color:#ead3ea}
  .cats.subs .cat:active{background:#ecd9f3}
  .cats.subs .cat.back{background:var(--card2);border-color:var(--line);color:var(--ink2)}
  .cat{text-align:center;line-height:1.15}
  .confirm{display:none;margin:0 16px;padding:12px;border-radius:18px;border:1px solid #ead3ea;
    background:linear-gradient(160deg,#fbeef6,#f1e4fa);box-shadow:var(--shadow)}
  body.st-card .confirm{display:block}
  /* One job per screen: amount → category → confirm */
  body.st-amt #cats,body.st-amt #confirm{display:none}
  body.st-cat #keys,body.st-cat #nextw,body.st-cat #confirm{display:none}
  body.st-card #keys,body.st-card #nextw,body.st-card #cats{display:none}
  /* Fill the phone: the amount takes whatever height is spare and sits centred
     in it; keys, tiles and card grow with the screen up to a comfortable cap. */
  .amt{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:72px;padding:4px 0 8px}
  body.st-amt .amt{font-size:clamp(48px,8.5svh,80px);letter-spacing:-2px}
  body.st-amt .amt small{font-size:.42em}
  body.st-cat .amt,body.st-card .amt{cursor:pointer;font-size:clamp(38px,7svh,70px)}
  body.st-cat .amt::after,body.st-card .amt::after{content:'tap to edit';display:block;font-size:12px;
    letter-spacing:.02em;font-weight:500;color:var(--ink3);margin-top:2px}
  body.st-amt .keys{grid-auto-rows:clamp(52px,9.6svh,98px);gap:clamp(6px,1svh,10px)}
  body.st-amt .key{padding:0;font-size:clamp(22px,3.6svh,34px);border-radius:16px}
  body.st-cat .cats{grid-auto-rows:clamp(84px,18svh,176px);gap:clamp(8px,1.2svh,12px)}
  body.st-cat .cat{padding:6px;font-size:clamp(13px,2svh,17px);gap:clamp(4px,1.2svh,12px);justify-content:center;border-radius:18px}
  body.st-cat .cat .e{font-size:clamp(28px,5.8svh,54px)}
  .confirm .seg button{padding:clamp(10px,3.3svh,30px) 0;font-size:clamp(14px,2.3svh,19px)}
  .confirm .note{padding:clamp(10px,2.6svh,22px) 14px;font-size:clamp(14px,2.1svh,17px)}
  .cfhead{font-size:clamp(17px,2.8svh,22px)}
  .confirm .go{min-height:clamp(58px,11.5svh,108px);font-size:clamp(18px,2.8svh,24px)}
  .confirm .toggles{gap:clamp(6px,1.4svh,12px);margin-top:clamp(10px,2svh,16px)}
  .confirm{padding:clamp(12px,2.4svh,20px)}
  .nextw{padding:8px 16px 2px}
  .curpill{display:flex;align-self:center;gap:3px;background:var(--card2);border-radius:14px;padding:3px;margin:6px auto 0;width:max-content}
  .curpill button{border:0;background:transparent;color:var(--ink2);font-size:13px;font-weight:700;padding:6px 16px;border-radius:11px;cursor:pointer}
  .curpill button.on{background:var(--grad);color:#fff}
  body:not(.st-amt) .curpill{display:none!important}
  body .amt .amtfx small.fxage{display:block;font-size:11px;color:var(--ink3);font-weight:500;margin-top:1px}
  .amtfx{display:block;font-size:15px;letter-spacing:0;font-weight:600;color:var(--lav);margin-top:2px}
  .next{display:block;width:100%;min-height:clamp(56px,7.5svh,70px);border:0;border-radius:16px;cursor:pointer;font-size:18px;font-weight:700;
    color:#fff;background:var(--grad);box-shadow:0 4px 14px rgba(199,138,180,.38);transition:transform .08s}
  .next:active{transform:scale(.97)}
  .next:disabled{background:var(--card2);color:var(--ink3);box-shadow:none}
  .confirm .toggles{padding:0;margin-top:10px}
  .confirm .seg{background:rgba(255,255,255,.55)}
  .confirm .note{width:100%;margin:8px 0 0}
  .cfhead{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700;color:var(--ink)}
  .cfhead small{color:var(--ink2);font-weight:500;font-size:13px}
  .cfhead button{margin-left:auto;border:0;background:rgba(255,255,255,.7);color:var(--ink2);
    border-radius:12px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer}
  .confirm .go{display:block;width:100%;margin-top:10px;min-height:56px;border:0;border-radius:16px;cursor:pointer;
    font-size:18px;font-weight:700;color:#fff;background:var(--grad);
    box-shadow:0 4px 14px rgba(199,138,180,.38);transition:transform .08s}
  .confirm .go:active{transform:scale(.97)}
  .confirm .go:disabled{background:rgba(255,255,255,.6);color:var(--ink2);box-shadow:none;font-size:15px;font-weight:600}
  .gsub{display:block;font-size:11px;color:var(--ink2);font-weight:500;margin-top:2px}

  .keys{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px 16px 2px}
  .key{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
    color:var(--ink);font-size:22px;font-weight:600;padding:11px 0;transition:.08s;cursor:pointer}
  .key:active{background:var(--card2);transform:scale(.96)}
  .key.act{color:var(--lav)}

  .foot{display:flex;gap:8px;padding:7px 16px calc(8px + var(--pad))}
  .foot button{flex:1;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);
    color:var(--ink2);font-size:12px;font-weight:600;padding:9px 4px;border-radius:12px;cursor:pointer}
  .foot button:active{background:var(--card2)}

  .sheet{position:fixed;inset:0;background:rgba(60,45,90,.28);display:none;align-items:flex-end;z-index:30}
  .sheet.open{display:flex}
  .sheet > div{background:var(--bg);width:100%;max-width:520px;margin:0 auto;border-radius:22px 22px 0 0;
    max-height:84vh;overflow:auto;padding:18px 18px calc(22px + var(--pad));box-shadow:0 -8px 30px rgba(60,45,90,.15)}
  .sheet h2{font-size:16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;font-weight:700}
  .sheet h2 span{color:var(--ink3);font-size:13px;font-weight:500}
  /* Settings: jump chips that stay put while she scrolls, and folds for the long lists */
  .sjump{position:sticky;top:-18px;z-index:2;margin:-6px -18px 4px;padding:8px 14px 10px;background:var(--bg);
    display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;border-bottom:1px solid var(--line)}
  .sjump::-webkit-scrollbar{display:none}
  .sjump button{flex:1 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink2);font-size:11.5px;font-weight:700;
    padding:6px 5px;border-radius:14px;white-space:nowrap}
  .sjump button:active{background:var(--mint-bg);color:var(--ink)}
  .sfold{display:flex;align-items:center;gap:10px;margin-top:6px;padding:12px 14px;border-radius:14px;background:var(--card);
    border:1px solid var(--line);cursor:pointer;font-size:14px;color:var(--ink)}
  .sfold small{display:block;font-size:11px;color:var(--ink2);margin-top:1px}
  .sfold .chev{margin-left:auto;color:var(--ink3);font-weight:700;transition:transform .2s}
  .sfold.on .chev{transform:rotate(90deg)}
  .sbody{display:none}.sbody.on{display:block}
  .bdh[id^="s-"]{scroll-margin-top:52px}
  .x{color:var(--ink3);font-size:22px;border:0;background:none;cursor:pointer;line-height:1}
  .x.back{font-size:14px;font-weight:600} /* 22px is for the ✕ glyph; a word needs far less */
  .row{display:flex;justify-content:space-between;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line);font-size:14px}
  .row.rowc{cursor:pointer}
  .row.rowc:active{background:var(--card2)}
  .row:last-child{border:0}
  .row .l{display:flex;align-items:center;gap:10px;min-width:0}
  .row>b.num,.row>.l>b.num{white-space:nowrap;margin-left:10px}
  .row .e{font-size:18px}
  .row small{color:var(--ink3);font-size:11px;display:block;margin-top:1px}
  .del{color:var(--blush);background:none;border:0;font-size:12px;font-weight:600;cursor:pointer;padding:6px}
  .bdh{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--lav);font-weight:700;margin:18px 0 4px}
  .copybtn{width:100%;background:var(--grad);color:#fff;border:0;border-radius:13px;font-size:15px;
    font-weight:700;padding:14px;margin-top:18px;cursor:pointer;box-shadow:var(--shadow)}
  .setrow{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
  .setrow input{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);color:var(--ink);
    border-radius:10px;padding:10px;font-size:14px}
  .mini{font-size:11px;color:var(--ink3);text-align:center;margin-top:8px;line-height:1.6}
  /* ✦ Glance — the laptop suite's summary, read from the Mac (2026-10-09) */
  .gl-hero{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .gl-k{font-size:11px;color:var(--ink2)}
  .gl-big{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:34px;line-height:1.1;color:var(--ink);margin:2px 0 8px}
  .gl-pill{position:absolute;top:14px;right:14px;font-size:11px;font-weight:600;color:var(--need);background:var(--need-bg);border-radius:99px;padding:3px 9px}
  .gl-bar{height:7px;border-radius:99px;background:var(--card2);overflow:hidden}
  .gl-bar i{display:block;height:100%;border-radius:99px;background:var(--bar);background-size:200% 100%;animation:glShine 3s linear infinite}
  @keyframes glShine{to{background-position:-200% 0}}
  .gl-sub{font-size:11px;color:var(--ink2);margin-top:7px;font-variant-numeric:tabular-nums}
  .gl-tiles{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin-top:10px}
  .gl-tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer}
  .gl-tile b{display:block;font-size:17px;font-weight:600;margin:3px 0 2px;transition:filter .2s}
  .gl-tile small{display:block;font-size:10.5px;color:var(--ink2);line-height:1.4;transition:filter .2s}
  .gl-hush b,.gl-hush small{filter:blur(6px)}
  .gl-dot{width:7px;height:7px;border-radius:50%;flex:none;margin-top:6px}
  .gl-tabs{margin:-4px 0 12px}
  .gl-pin{width:100%;text-align:center;font-size:24px;letter-spacing:.5em;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:10px;color:var(--ink);margin:8px 0}
  .gl-up{color:var(--need)} .gl-dn{color:var(--blush)}
  .gl-lot{font-size:11.5px;color:var(--ink2);padding:2px 0 8px 2px;line-height:1.6}
  .gl-leg{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--ink2);margin-top:6px}
  .gl-leg i{display:inline-block;width:9px;height:3px;border-radius:2px;margin-right:4px;vertical-align:middle}
  @media (prefers-reduced-motion:reduce){.gl-bar i{animation:none}}
  .nudge{margin:0 16px 7px;background:var(--want-bg);border:1px solid var(--line);border-radius:12px;
    padding:9px 12px;font-size:12px;color:var(--ink);display:none;cursor:pointer;box-shadow:var(--shadow);text-align:center}
  .nudge b{color:var(--want)}
  /* the after-log card sits under the month total, in the hero's empty
     space — it used to cover . 0 ⌫ and Next for six seconds */
  .last{position:fixed;left:50%;top:var(--lastTop,96px);transform:translateX(-50%) translateY(-12px);
    width:calc(100% - 28px);max-width:492px;background:var(--card);border:1px solid var(--line);
    border-radius:16px;padding:10px 12px;opacity:0;pointer-events:none;transition:.25s;z-index:40;
    box-shadow:0 6px 20px rgba(60,45,90,.22)}
  .last.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
  .ltop{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink)}
  .ltop .x{margin-left:auto}
  .lchips{display:flex;gap:6px;margin-top:8px;align-items:center}
  .lchip{border:1px solid var(--line);background:var(--card2);border-radius:14px;padding:6px 12px;
    font-size:12px;font-weight:600;color:var(--ink);cursor:pointer}
  .lchip.n-on{background:var(--need-bg);color:var(--need);border-color:transparent}
  .lchip.w-on{background:var(--want-bg);color:var(--want);border-color:transparent}
  .lhint{margin-left:auto;font-size:11px;color:var(--ink3);white-space:nowrap;overflow:hidden;min-width:0}
  .lchips .lchip{white-space:nowrap;flex-shrink:0}
  .lchips .lchip.lcat{flex-shrink:1;min-width:0;overflow:hidden;text-overflow:ellipsis} /* a long sub gives way, the 💗 never falls off */
  .lchip.lh{padding:6px 9px;color:#e9a3b8;font-size:13px;line-height:1}
  .lchip.lh.h-on{background:#fde7ee;border-color:#f4c4d2}
  .lchip.cat-on{background:linear-gradient(160deg,#fbeef6,#f1e4fa);border-color:#ead3ea;color:var(--ink)}
  .lpick{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
  .lpick .lchip.cur{background:var(--grad);color:#fff;border-color:transparent}
  .pace{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:11px 13px;
    font-size:13px;color:var(--ink2);margin-bottom:4px}
  .pace b{color:var(--need)}
  .pace.over b{color:var(--blush)}
  .itabs .seg{flex:1;margin-right:8px}
  .itabs .seg button{padding:8px 0;font-size:13px}
  .tpick{display:flex;gap:6px;overflow-x:auto;margin:-4px 0 10px;scrollbar-width:none}
  .tpick button{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:6px 12px;font-size:12px;font-weight:600;color:var(--ink2);white-space:nowrap;cursor:pointer}
  .tpick button.on{background:var(--grad);color:#fff;border-color:transparent}
  .tripline{text-align:center;font-size:12px;font-weight:600;color:var(--lav);margin-top:6px;cursor:pointer}
  body:not(.st-amt) .tripline{display:none!important}
  .imh{display:flex;align-items:center;gap:4px;margin:-4px 0 10px}
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
  .kpi{background:linear-gradient(160deg,#fbeef6,#f1e4fa);border:1px solid #ead3ea;border-radius:15px;padding:10px 8px;text-align:center;min-width:0}

// A category/account name going into an inline onclick: escape for the JS
// string literal first, then for the double-quoted HTML attribute around it.
function jsq(s){return esc(String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"));}
function load(k,f){try{var v=JSON.parse(localStorage.getItem(k));return v==null?f:v;}catch(e){return f;}}
/* A non-quiet save is a change you made; a quiet one is the sync or a
   migration writing back. Only the former restamps settings, so a config
   pulled from another device keeps the time it was actually edited. */
function save(k,v,quiet){
  if(!quiet && k===CKEY && v) v.u=Date.now();
  try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}
  if(!quiet)schedSync();
}

var entries = load(KEY, []);

/* ---- Deletion tombstones ----------------------------------------------
   Sync merges entries but has no way to express "this one is gone", so a
   delete on one device used to be undone by the next pull from another.
   Every removal now records the entry's key here; the list rides along in
   the sync payload, and a pull deletes anything the other device buried
   and refuses to re-add it. Pruned after 180 days — long past the point
   where a stale device could still resurrect something. ------------------ */
var TOMB_TTL = 180*864e5;
var deleted = load(DKEY, []);
function entryKey(e){ return e.ts+'|'+parseFloat(e.amt); } // same identity sync dedupes on
function tombPrune(){
  var cut=Date.now()-TOMB_TTL;
  deleted=deleted.filter(function(d){ return d && d.k && (d.t||0)>cut; });
}
function tombstone(e){
  if(!e||!e.ts) return;
  var k=entryKey(e);
  deleted=deleted.filter(function(d){ return d.k!==k && !(e.id&&d.id===e.id); });
  deleted.push({k:k, id:e.id||null, t:Date.now()});
  tombPrune(); save(DKEY,deleted,true);
}
// A remote entry is buried if either identity matches — id for anything
// logged since ids existed, date+amount for the older rows.
function isTombed(e,tombK,tombI){ return (entryKey(e) in tombK) || !!(e.id && (e.id in tombI)); }
function untomb(k){ // an entry with this key exists again — let it live
  var n=deleted.length;
  deleted=deleted.filter(function(d){ return d.k!==k; });
  if(deleted.length!==n) save(DKEY,deleted,true);
}
tombPrune();
var MAKAN_KEY='xpense_makan_v1';
var makanEntries = load(MAKAN_KEY, []);
var cfg = load(CKEY, {cats:DEFAULT_CATS, methods:DEFAULT_METHODS, method:'TnG', need:'want', budget:0});
if(!cfg.cats) cfg.cats = DEFAULT_CATS;
if(!cfg.methods || !cfg.methods.length) cfg.methods = DEFAULT_METHODS;
if(cfg.methods.indexOf(cfg.method)<0) cfg.method = cfg.methods[0];

function genId(){return crypto.randomUUID?crypto.randomUUID():(Date.now()+'-'+Math.random().toString(36).slice(2));}
(function backfillIds(){ // older/imported entries may predate the id field
  var added=false;
  entries.forEach(function(e){ if(!e.id){ e.id=genId(); added=true; } });
  if(added) save(KEY,entries,true);
})();
function findGroup(n){ for(var i=0;i<cfg.cats.length;i++) if(cfg.cats[i].n===n) return cfg.cats[i]; return null; }
function findSub(g,n){ if(!g||!n) return null; for(var i=0;i<g.subs.length;i++) if(g.subs[i].n===n) return g.subs[i]; return null; }
function iconFor(cat,sub){ var g=findGroup(cat), s=findSub(g,sub); return s?s.e:(g?g.e:null); }
// "Food › GrabFood", or just the group for a row filed without a sub
var CATCH='Others'; // the Others group's own "anything else" tile — filed, so it never needs re-filing
function catLabel(e){ return (e.sub&&e.sub!==e.cat) ? e.cat+' › '+e.sub : (e.cat||'Others'); }
function shortLabel(e){ return (e.sub&&e.sub!==CATCH) ? e.sub : (e.sub===CATCH&&e.cat!==CATCH ? e.cat+' · others' : (e.cat||'Others')); }

/* Flat settings (every version before groups) become the tree once. Old
   categories that the tree doesn't absorb stay as their own group, so
   nothing she made disappears. Safe to run again whenever settings arrive
   from an old backup or another device. */
function migrateCats(){
  var changed=false;
  if(!cfg.catV || cfg.cats.some(function(c){ return !c.subs; })){
    var tree=JSON.parse(JSON.stringify(DEFAULT_CATS));
    var names={}; tree.forEach(function(g){ names[catNorm(g.n)]=1; });
    (cfg.cats||[]).forEach(function(c){
      if(!c||!c.n) return;
      var k=catNorm(c.n);
      if(OLD_CATS[k]||names[k]) return;
      names[k]=1;
      tree.splice(tree.length-1,0,{e:c.e||'•',n:c.n,subs:(c.subs||[])});
    });
    cfg.cats=tree; cfg.catV=2; changed=true;
  }
  /* Two groups that are the same name give or take a space or capital
     ("Wellness" and "Wellness ") were kept apart, which is how she ended
     up with two Wellness tiles. Fold the later into the first: its subs
     join (no doubles), its limit carries if the first had none. */
  var seen={}, kept=[];
  cfg.cats.forEach(function(g){
    var k=catNorm(g.n), first=seen[k];
    if(!first){ seen[k]=g; kept.push(g); return; }
    (g.subs||[]).forEach(function(sb){ if(!first.subs.some(function(x){return catNorm(x.n)===catNorm(sb.n);})) first.subs.push(sb); });
    if(cfg.limits&&cfg.limits[g.n]&&!cfg.limits[first.n]) cfg.limits[first.n]=cfg.limits[g.n];
    if(cfg.limits) delete cfg.limits[g.n];
    changed=true;
  });
  if(kept.length!==cfg.cats.length) cfg.cats=kept;
  if(changed) save(CKEY,cfg);
}
function catNorm(n){ return String(n||'').trim().toLowerCase(); }
migrateCats();
/* Her categories in the woman versions of the people emoji (2026-10-07).
   Once, and only where the old default is still there — an emoji she
   picked herself is left alone. Entries follow via syncCatIcons. */
(function femaleEmoji(){
  if(cfg.emojiV>=1) return;
  var F={'💇':'💇‍♀️','💆':'💆‍♀️','🧖':'🧖‍♀️','🧘':'🧘‍♀️','🏋️':'🏋️‍♀️','🏋':'🏋️‍♀️','🙆':'🙆‍♀️','🏃':'🏃‍♀️','🚶':'🚶‍♀️','🧑':'👩'};
  cfg.cats.forEach(function(g){ if(F[g.e]) g.e=F[g.e]; (g.subs||[]).forEach(function(sb){ if(F[sb.e]) sb.e=F[sb.e]; }); });
  cfg.emojiV=1; save(CKEY,cfg);
})();

function syncCatIcons(){
  /* Old rows are refiled under their new group/sub (stamped, so the cloud
     copy and the other device take the new filing), and an entry's icon is
     realigned with whatever its category says now — importing on a device
     that didn't know a category used to bake a fallback 📌 into the rows. */
  var moved=false, fixed=false, now=Date.now();
  entries.forEach(function(e){
    var m=OLD_CATS[String(e.cat||'').toLowerCase()];
    // a name that is a live group now (say she makes a "Drinks" group) is hers, not an old one
    if(m && !e.sub && !findGroup(e.cat)){
      e.cat=m[0]; if(m[1]) e.sub=m[1]; e.u=now; moved=true;
    }
    if(e.cat&&!findGroup(e.cat)){ // "Wellness " → "Wellness" once the twin group is folded away
      var tw=cfg.cats.find(function(g){return catNorm(g.n)===catNorm(e.cat);});
      if(tw){ e.cat=tw.n; e.u=now; moved=true; }
    }
    if(e.sub){ var gg=findGroup(e.cat), ts=gg&&!findSub(gg,e.sub)&&gg.subs.find(function(x){return catNorm(x.n)===catNorm(e.sub);});
      if(ts){ e.sub=ts.n; e.u=now; moved=true; } }
    var want=iconFor(e.cat,e.sub);
    if(want && e.e!==want){ e.e=want; fixed=true; }
  });
  if(moved) save(KEY,entries);
  else if(fixed) save(KEY,entries,true);
}
syncCatIcons();

var amt = '';
var monthKey = ymKey(new Date());

function ymKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function dKey(d){return ymKey(d)+'-'+String(d.getDate()).padStart(2,'0');}
function fmt(n){return Math.round(n).toLocaleString('en-MY');}
function fmt2(n){return n%1? n.toFixed(2) : fmt(n);}
function entryDay(e){return e.ts? dKey(new Date(e.ts)) : '';}
function entryMonth(e){return entryDay(e).slice(0,7);}
function thisMonth(){return entries.filter(function(e){return entryMonth(e)===monthKey;});}
function todayKey(){return dKey(new Date());}
function streak(){
  var days={}; entries.forEach(function(e){days[entryDay(e)]=1;});
  var n=0, d=new Date();
  if(!days[dKey(d)]) d.setDate(d.getDate()-1); // today not logged yet doesn't break the streak
  while(days[dKey(d)]){n++;d.setDate(d.getDate()-1);}
  return n;
}

function renderTotals(){
  var mo = thisMonth(), mTot = mo.reduce(function(s,e){return s+e.amt;},0);
  var tToday = mo.filter(function(e){return entryDay(e)===todayKey();}).reduce(function(s,e){return s+e.amt;},0);
  var md=new Date(monthKey+'-01T00:00:00'), dim=new Date(md.getFullYear(),md.getMonth()+1,0).getDate(), day=new Date().getDate();
  document.getElementById('monthLbl').textContent = md.toLocaleDateString('en-GB',{month:'long'});
  document.getElementById('hday').textContent = 'day '+day+' of '+dim;
  document.getElementById('mtot').innerHTML = '<small>RM</small>'+fmt(mTot);
  var st=streak(), fire=st>=2?' · 🔥'+st:'';
  var left='<span>RM <b>'+fmt(tToday)+'</b> today'+fire+'</span>';
  var bar=document.getElementById('bar'), bw=document.getElementById('barw');
  bw.querySelectorAll('.tick,.tip').forEach(function(x){x.remove();});
  var pacePct=(day/dim)*100;
  if(cfg.budget>0){
    var r=mTot/cfg.budget, w=Math.min(r,1)*100, should=cfg.budget*day/dim, st2;
    bar.style.width=w+'%';
    bar.style.background = r>1?'var(--blush)': r>0.85?'var(--peach)':'var(--bar)';
    /* the tick is where an even month would be today */
    bw.insertAdjacentHTML('beforeend','<span class="tick" style="left:'+pacePct.toFixed(1)+'%"></span>'+(w>3&&r<=1?'<span class="tip" style="left:'+w.toFixed(1)+'%">✦</span>':''));
    if(r>1) st2='<span class="hst over">RM '+fmt(mTot-cfg.budget)+' over</span>';
    else if(mTot>should*1.1) st2='<span class="hst hot">RM '+fmt(cfg.budget-mTot)+' left · ahead of pace</span>';
    else st2='<span class="hst ok">RM '+fmt(cfg.budget-mTot)+' left · on track</span>';
    document.getElementById('sub').innerHTML=left+st2;
  } else {
    bar.style.width=pacePct+'%'; bar.style.background='var(--bar)'; // no budget: the bar is just the month going by
    document.getElementById('sub').innerHTML=left+'<span class="hset" onclick="event.stopPropagation();openSheet(\'set\')">set a budget ›</span>';
  }
}
/* Travel currency: type what the receipt says, store it in RM. The entry's
   amt stays ringgit so every total, the budget and Wealth OS are untouched;
   fx keeps what was actually paid. */
var CURS={THB:'฿',SGD:'S$',JPY:'¥',KRW:'₩',IDR:'Rp',VND:'₫',TWD:'NT$',HKD:'HK$',CNY:'¥',USD:'US$',EUR:'€',GBP:'£',AUD:'A$'};
function fxOn(){ return !!(cfg.fx&&cfg.fx.c&&cfg.fx.r>0&&cfg.fxOn); }
function curSym(c){ return CURS[c]||c+' '; }
function toRM(v){ return fxOn()?Math.round(v*cfg.fx.r*100)/100:v; }
function fxAge(t){
  var m=Math.round((Date.now()-t)/60000);
  return m<60?'updated just now':m<1440?'updated '+Math.round(m/60)+'h ago':'updated '+new Date(t).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
}
function fxTag(e){ return e.fx?' · '+curSym(e.fx.c)+fmt2(e.fx.a):''; }
function setCur(on){ cfg.fxOn=!!on; save(CKEY,cfg); renderCur(); renderAmt();  }
/* Trips: choosing a travel currency starts one; everything logged until
   End trip is tagged to it (in any currency), and older entries — flights
   booked months ahead — can be tagged from the edit screen. Insights gets
   a Trips tab once there is one. */
var TRIP_NAME={THB:'Thailand',SGD:'Singapore',JPY:'Japan',KRW:'Korea',IDR:'Indonesia',VND:'Vietnam',TWD:'Taiwan',HKD:'Hong Kong',CNY:'China',USD:'USA',EUR:'Europe',GBP:'UK',AUD:'Australia'};
function activeTrip(){ return cfg.tripOn&&(cfg.trips||[]).find(function(t){return t.id===cfg.tripOn;})||null; }
function tripById(id){ return (cfg.trips||[]).find(function(t){return t.id===id;})||null; }
function tripEntries(id){ return entries.filter(function(e){return e.trip===id;}); }
function startTrip(c){
  if(activeTrip()) return;
  var t={id:genId(), name:(TRIP_NAME[c]||c)+' '+new Date().toLocaleDateString('en-GB',{month:'short',year:'numeric'}), c:c, start:Date.now(), end:null};
  cfg.trips=(cfg.trips||[]).concat([t]); cfg.tripOn=t.id;
}
function endTrip(){
  var t=activeTrip(); if(!t) return;
  if(!confirm('End '+t.name+'?\n\nNew spending goes back to RM and stops being tagged to the trip.')) return;
  t.end=Date.now(); cfg.tripOn=null; cfg.fx=null; cfg.fxOn=false;
  save(CKEY,cfg); renderCur(); renderAmt(); openSheet('set'); toast(t.name+' ended · see it in Insights → Trips');
}
function renderCur(){
  var tl=document.getElementById('tripline'), t=activeTrip();
  if(t){ var tt=tripEntries(t.id).reduce(function(a,e){return a+e.amt;},0);
    tl.innerHTML='✈️ '+esc(t.name)+' · RM '+fmt(tt)+' so far'; tl.style.display=''; }
  else tl.style.display='none';
  var p=document.getElementById('curpill');
  if(!(cfg.fx&&cfg.fx.c&&cfg.fx.r>0)){ p.style.display='none'; return; }
  p.style.display='';
  p.innerHTML='<button class="'+(fxOn()?'':'on')+'" onclick="setCur(false)">RM</button>'+
    '<button class="'+(fxOn()?'on':'')+'" onclick="setCur(true)">'+curSym(cfg.fx.c)+' '+esc(cfg.fx.c)+'</button>';
}
function renderAmt(){
  var el=document.getElementById('amt');
  var fx=fxOn(), v=parseFloat(amt)||0;
  el.innerHTML='<span><small>'+(fx?curSym(cfg.fx.c):'RM')+'</small>'+(amt===''?'0':amt)+'</span>'+
    (fx?'<span class="amtfx">≈ RM '+fmt2(toRM(v))+'<small class="fxage">1 '+esc(cfg.fx.c)+' = RM '+cfg.fx.r+(cfg.fx.t?' · '+fxAge(cfg.fx.t):'')+'</small></span>':'');
  el.classList.toggle('zero', amt==='');
  renderPend(); // ✓ Log wakes up once a picked category has an amount
}
function renderMethods(){
  var s=document.getElementById('methodSeg');s.innerHTML='';
  cfg.methods.forEach(function(m){
    var b=document.createElement('button');b.dataset.v=m;b.textContent=m;
    b.className=(m===cfg.method?'on':'');s.appendChild(b);
  });
}
function renderNeed(){
  document.querySelectorAll('#needSeg button').forEach(function(b){b.classList.toggle('on',b.dataset.v===cfg.need);});
}
/* The grid shows groups; a group with subs swaps the grid for its subs.
   Order never matters: with an amount typed, the last tap logs; without
   one, it picks the category and ✓ Log appears once there's an amount. */
/* Monthly limit per group (cfg.limits, RM). Shown on the group tile while
   logging and as "x of limit" in Insights; no limit = no fuss. */
function limitOf(n){ var l=cfg.limits&&cfg.limits[n]; return l>0?l:0; }
function spentThisMonth(n){ return monthOf(monthKey).filter(function(e){return e.cat===n;}).reduce(function(a,e){return a+e.amt;},0); }
function limitTone(v,l){ return v>l?'over':v>=0.85*l?'near':''; }
var openGroup=null, pending=null; // pending = {g:group, s:sub|null}
function renderCats(){
  var c=document.getElementById('cats');c.innerHTML='';
  var g=openGroup&&findGroup(openGroup), tiles=[];
  if(g){
    tiles.push({e:'‹',n:g.n,cls:'back',fn:function(){openGroup=null;renderCats();}});
    g.subs.forEach(function(s,i){ tiles.push({e:s.e,n:s.n,idx:i,fn:function(el){pick(g,s,el);}}); });
    if(g.n===CATCH) tiles.push({e:g.e,n:CATCH,fn:function(el){pick(g,{e:g.e,n:CATCH},el);}});
  } else {
    cfg.cats.forEach(function(cat,i){
      var lim=limitOf(cat.n), left='';
      if(lim){ var sp=spentThisMonth(cat.n); left=sp>lim?'<span class="tleft over">RM '+fmt(sp-lim)+' over</span>':'<span class="tleft '+limitTone(sp,lim)+'">RM '+fmt(lim-sp)+' left</span>'; }
      tiles.push({e:cat.e,n:cat.n,idx:i,note:left,fn:function(el){
        if(cat.subs&&cat.subs.length){ openGroup=cat.n; renderCats(); }
        else pick(cat,null,el);
      }});
    });
  }
  // subs in two wide columns: a short list then fills the same block as the groups instead of leaving a hole
  var cols=g?2:(tiles.length>9?4:3);
  c.className='cats'+(cols===4?' g4':'')+(g?' subs':'');
  var n=tiles.length, rem=n%cols, head=rem?n-rem:n;
  tiles.forEach(function(t,idx){
    if(!g && idx===head && rem){ // push the last partial row to the right so the most-used (last) sit bottom-right
      for(var s=0;s<(cols-rem);s++){var ph=document.createElement('div');ph.className='cat-ph';c.appendChild(ph);}
    }
    var d=document.createElement('button');d.className='cat'+(t.cls?' '+t.cls:'');
    d.innerHTML='<span class="e">'+t.e+'</span>'+esc(t.n)+(t.note||'');
    if(t.idx!=null) d.dataset.idx=t.idx;
    d.onclick=function(){ if(dragJustEnded) return; t.fn(d); };
    c.appendChild(d);
  });
}
/* Hold a tile ~half a second to lift it, slide over another tile to take
   its place, let go to keep the order. A quick tap still picks; moving
   before the hold fires is treated as a scroll, not a drag. Works on the
   groups and on a group's subs (the back tile and Others' catch-all stay put). */
var drag=null, dragJustEnded=false;
(function(){
  var c=document.getElementById('cats');
  c.addEventListener('pointerdown',function(ev){
    var t=ev.target.closest('.cat'); if(!t||t.dataset.idx==null) return;
    var st={el:t,x:ev.clientX,y:ev.clientY,on:false,id:ev.pointerId};
    st.timer=setTimeout(function(){
      st.on=true; drag=st; t.classList.add('lift'); c.classList.add('dragging');
      if(navigator.vibrate) navigator.vibrate(12);
    },420);
    drag=st;
  });
  c.addEventListener('pointermove',function(ev){
    if(!drag) return;
    if(!drag.on){ if(Math.abs(ev.clientX-drag.x)+Math.abs(ev.clientY-drag.y)>10){ clearTimeout(drag.timer); drag=null; } return; }
    ev.preventDefault();
    var over=document.elementFromPoint(ev.clientX,ev.clientY); over=over&&over.closest('.cat');
    if(!over||over===drag.el||over.dataset.idx==null) return;
    var kids=[].slice.call(c.children), a=kids.indexOf(drag.el), b=kids.indexOf(over);
    c.insertBefore(drag.el, a<b?over.nextSibling:over);
  },{passive:false});
  function end(){
    if(!drag) return;
    clearTimeout(drag.timer);
    if(drag.on){
      dragJustEnded=true; setTimeout(function(){dragJustEnded=false;},350);
      var order=[].slice.call(c.querySelectorAll('.cat[data-idx]')).map(function(el){return +el.dataset.idx;});
      var g=openGroup&&findGroup(openGroup), list=g?g.subs:cfg.cats;
      var moved=order.some(function(v,i){return v!==i;});
      if(moved){
        var next=order.map(function(i){return list[i];});
        if(g) g.subs=next; else cfg.cats=next;
        save(CKEY,cfg);
      }
      c.classList.remove('dragging');
      renderCats();
    }
    drag=null;
  }
  c.addEventListener('pointerup',end); c.addEventListener('pointercancel',end);
  c.addEventListener('contextmenu',function(ev){ if(drag) ev.preventDefault(); });
})();
function pick(g,s,el){
  pending={g:g,s:s}; openGroup=null;
  var d=catDefault(g.n,s&&s.n)||{};
  if(d.method) cfg.method=d.method;
  if(d.need) cfg.need=d.need;
  renderMethods(); renderNeed();
  renderCats(); renderPend();
  if(navigator.vibrate) navigator.vibrate(8);
}
var step='amt';
function setStep(st){ step=st; document.body.classList.remove('st-amt','st-cat','st-card'); document.body.classList.add('st-'+st); }
function toAmount(){ if(step==='amt') return; pending=null; openGroup=null; renderCats(); setStep('amt'); renderPend(); }
function toCats(){ if(!(parseFloat(amt)>0)) return; openGroup=null; renderCats(); setStep('cat'); }
function renderPend(){
  var nx=document.getElementById('next');
  if(nx){ var ok=parseFloat(amt)>0; nx.disabled=!ok; nx.textContent=ok?'Next ›':'Type the amount'; }
  if(!pending){ if(step==='card') setStep(parseFloat(amt)>0?'cat':'amt'); return; }
  var s=pending.s, g=pending.g, v=parseFloat(amt)>0;
  document.getElementById('cfWhat').innerHTML=(s?s.e:g.e)+' '+esc(s&&s.n!==CATCH?s.n:g.n)+
    (s&&s.n!==CATCH?' <small>· '+esc(g.n)+'</small>':'');
  var go=document.getElementById('cfGo');
  go.disabled=!v; go.textContent=!v?'Type the amount':fxOn()?'✓ Log '+curSym(cfg.fx.c)+fmt2(parseFloat(amt))+' · RM '+fmt2(toRM(parseFloat(amt))):'✓ Log RM '+fmt2(parseFloat(amt));
  setStep('card');
}
// back to the grid, on the group she was in — the usual change is a sub next door
function changePick(){ var g=pending&&pending.g; pending=null; openGroup=(g&&g.subs.length)?g.n:null; renderCats(); setStep('cat'); }
function clearPend(){ pending=null; renderPend(); }
function logPend(){
  if(!pending||!(parseFloat(amt)>0)) return;
  var p=pending; pending=null;
  logExpense(p.g,p.s,null);
  openGroup=null; renderCats(); setStep('amt'); renderPend();
}
function renderKeys(){
  var k=document.getElementById('keys');k.innerHTML='';
  ['1','2','3','4','5','6','7','8','9','.','0','⌫'].forEach(function(t){
    var b=document.createElement('button');b.className='key'+(t==='⌫'||t==='.'?' act':'');b.textContent=t;
    b.onclick=function(){press(t);};

function catDefault(name,sub){ // majority method/need from this category's last 20 logs; needs ≥3 logs and a 70% majority

  for(var i=entries.length-1;i>=0&&cnt<20;i--){
    var e=entries[i]; if(e.cat!==name||(e.sub||'')!==(sub||'')) continue;
    cnt++; m[e.method]=(m[e.method]||0)+1; n[e.need]=(n[e.need]||0)+1;
  }
  if(cnt<3) return null;
  function top(o){var b=null;for(var k in o)if(b===null||o[k]>o[b])b=k;return b;}
  var tm=top(m), tn=top(n);
  return {
    method:(m[tm]>=cnt*0.7&&cfg.methods.indexOf(tm)>=0)?tm:null,
    need:(n[tn]>=cnt*0.7)?tn:null

    var t=new Date(e.ts);

// ISO timestamp -> value for <input type="datetime-local"> in the phone's local time.
function toLocalInput(ts){
  var d=ts?new Date(ts):new Date(), p=function(n){return String(n).padStart(2,'0');};
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes());
}

function catOptions(e){

  var html=cfg.cats.map(function(g){

}

/* Same day-of-month n months on, clamped to the month's last day so a
   purchase on the 31st doesn't skid into the following month. */
function addMonths(d,n){
  var day=d.getDate(), x=new Date(d.getTime());
  x.setDate(1); x.setMonth(x.getMonth()+n);
  x.setDate(Math.min(day, new Date(x.getFullYear(),x.getMonth()+1,0).getDate()));
  return x;
}
/* Turn one lump-sum entry into n monthly ones. Split in cents so the parts
   always add back to the original — the last month absorbs the remainder. */
function splitInstallments(id){
  var e=entries.find(function(x){return x.id===id;});
  if(!e) return;
  var n=parseInt((document.getElementById('edMonths')||{}).value,10);
  if(!(n>=2&&n<=60)){ toast('Enter 2–60 months'); return; }
  var aEl=document.getElementById('edAmt'), amtV=aEl?parseFloat(aEl.value):e.amt;
  if(!(amtV>0)) amtV=e.amt;
  var wEl=document.getElementById('edWhen'), base=new Date(e.ts);
  if(wEl&&wEl.value){ var nd=new Date(wEl.value); if(!isNaN(nd.getTime())) base=nd; }
  var total=Math.round(amtV*100), per=Math.floor(total/n);
  if(per<1){ toast('Too small to split'); return; }
  var last=total-per*(n-1);
  if(!confirm('Split RM '+fmt2(total/100)+' into '+n+' monthly entries?\n\n'+
      (n-1)+' × RM '+fmt2(per/100)+(last!==per?'\n1 × RM '+fmt2(last/100):'')+
      '\nFrom '+base.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})+
      ' to '+addMonths(base,n-1).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}))) return;
  /* Every part carries the same inst tag: which plan it belongs to, its
     place in it, and what the original purchase cost. Wealth OS reassembles
     the whole purchase from this — otherwise a RM4,000 buy split 12 ways
     never clears its RM1,000 exceptional-expense threshold. */
  var gid=genId(), note=(e.note||'').trim(), rows=[];
  var tot=total/100, firstTs=base.toISOString(), desc=note||shortLabel(e);
  for(var i=0;i<n;i++){
    var part={id:genId(), amt:(i===n-1?last:per)/100, cat:e.cat, e:e.e, method:e.method,
      need:e.need, note:(note?note+' ':'')+(i+1)+'/'+n, ts:addMonths(base,i).toISOString(), u:Date.now(),
      inst:{g:gid, i:i+1, n:n, tot:tot, d:firstTs, desc:desc}};
    if(e.sub) part.sub=e.sub;
    if(e.tag) part.tag=e.tag;
    rows.push(part);
  }
  /* The lump sum is gone everywhere, not just here — without this the other
     device keeps it and syncs back both the original and the 12 parts. */
  tombstone(e);
  entries.splice(entries.indexOf(e),1);
  rows.forEach(function(r){untomb(entryKey(r));entries.push(r);});
  entries.sort(function(a,b){return a.ts<b.ts?-1:1;});
  save(KEY,entries);
  hideLast(); renderTotals(); 
  toast('Split into '+n+' monthly entries');
  openSheet(editBack);
}
function wireEdit(id){

    if(seg) seg.addEventListener('click',function(ev){

function saveEdit(id){
  var e=entries.find(function(x){return x.id===id;});
  if(!e) return;
  var v=parseFloat((document.getElementById('edAmt')||{}).value);
  if(!(v>0)){ toast('Enter a valid amount'); return; }
  var oldKey=entryKey(e); // amount/date changes reissue the entry's identity
  var plan=planParts(e); // before anything changes — an older plan is matched partly by its category
  var cv=String((document.getElementById('edCat')||{}).value||'').split(CSEP);
  e.amt=v;
  if(cv[0]){ e.cat=cv[0]; if(cv[1]) e.sub=cv[1]; else delete e.sub; e.e=iconFor(e.cat,e.sub)||e.e; }
  e.method=(document.getElementById('edMethod')||{}).value||e.method;
  var tEl=document.getElementById('edTrip'); if(tEl){ if(tEl.value) e.trip=tEl.value; else delete e.trip; }
  var needBtn=document.querySelector('#edNeed button.on');
  e.need=needBtn?needBtn.dataset.v:e.need;
  var himBtn=document.querySelector('#edHim button.on');
  if(himBtn){ if(himBtn.dataset.v==='him') e.tag='him'; else delete e.tag; }
  /* the other months of the same installment follow (amount and date stay
     their own) — otherwise re-filing a 12-month plan is 12 edits */
  var allEl=document.getElementById('edAll'), moved=0;
  if(allEl&&allEl.checked){
    var now=Date.now();
    plan.forEach(function(x){
      if(x===e) return;
      x.cat=e.cat; if(e.sub) x.sub=e.sub; else delete x.sub; x.e=e.e;
      x.method=e.method; x.need=e.need; if(e.trip) x.trip=e.trip; else delete x.trip; if(e.tag) x.tag=e.tag; else delete x.tag;
      x.u=now; moved++;
    });
  }
  e.note=((document.getElementById('edNote')||{}).value||'').trim();
  var wEl=document.getElementById('edWhen');
  if(wEl&&wEl.value){var nd=new Date(wEl.value); if(!isNaN(nd.getTime())) e.ts=nd.toISOString();}
  e.u=Date.now();
  /* Bury the old identity so the pre-edit copy on another device is
     replaced rather than surviving alongside the corrected one. */
  var newKey=entryKey(e);
  if(newKey!==oldKey){ tombstone({ts:oldKey.split('|')[0], amt:oldKey.split('|')[1]}); untomb(newKey); }
  entries.sort(function(a,b){return a.ts<b.ts?-1:1;}); // a backdated entry may need to move
  save(KEY,entries);
  renderTotals();
  toast(moved?'Saved · all '+(moved+1)+' parts re-filed':'Saved');
  openSheet(editBack);
}

/* rides the same gist/token/passphrase as the spend sync above (ghReq,
   encryptPayload, cfg.ghToken/gistId/syncPass) but only once that gist
   already exists — a Makan-only device never creates its own gist, it
   always joins the Spend gist. */
var makanSyncT=null, makanSyncing=false;
function schedMakanSync(){
  if(!cfg.ghToken||!cfg.gistId)return;
  clearTimeout(makanSyncT);setCloud('pending');
  makanSyncT=setTimeout(function(){pushMakanSync();},1800);
}
function pushMakanSync(interactive){
  if(!cfg.ghToken||!cfg.gistId||makanSyncing)return;makanSyncing=true;
  var txt=JSON.stringify({entries:makanEntries});
  function send(content){
    var files={};files[MAKAN_FILE]={content:content};
    ghReq('PATCH','https://api.github.com/gists/'+cfg.gistId,{files:files},function(err){
      makanSyncing=false;
      if(err){syncFail(err,interactive);return;}
      setCloud('ok');
      if(interactive)toast('Makan log synced ☁️');
    });
  }
  if(cfg.syncPass)encryptPayload(txt,cfg.syncPass).then(send,function(){makanSyncing=false;syncFail(new Error('encrypt'),interactive);});
  else send(txt);
}

/* Insights: one month at a time (‹ › to look back), top to bottom —
   how much and how it's pacing, where it went, need vs want, the biggest
   buys, the days, the accounts. Tapping any line opens the entries behind it. */
var insMonth=null;
function insKey(){ return insMonth||monthKey; }
function insShift(n){ var d=new Date(insKey()+'-01T00:00:00'); d.setMonth(d.getMonth()+n); var k=ymKey(d); if(k>monthKey) return; insMonth=k; openSheet('break'); }
function monthOf(k){ return entries.filter(function(e){return entryMonth(e)===k;}); }
var insTab='month', insTrip=null;
function insTabs(){

}
function insGo(t,mk){ insTab=t; if(mk!==undefined) insMonth=mk; openSheet('break'); }

/* Trends: the big picture the laptop page has, on the phone — usual month,
   the year so far, 12 months of bars (everyday vs one-offs at the same
   RM 1,000 line Wealth OS uses), each group's last six months, need share,
   the year's top groups, and installments still to come. */
var ONE_OFF=1000;
/* ▲▼ against the usual. Spending is lumpy (one vet bill, one facial), so a
   month in progress isn't projected until day 20 — before that it only says
   ▲ once she has already passed the usual. Past months compare straight. */
function vsUsual(v,usual,inProgress,day,dim){
  if(!(usual>=20)) return '';
  var dp;
  if(!inProgress) dp=Math.round((v-usual)/usual*100);
  else if(day>=20) dp=Math.round((v/day*dim-usual)/usual*100);
  else dp=v>usual?Math.round((v-usual)/usual*100):0;
  if(dp>=20) return '<span class="ichip up">▲'+dp+'%</span>';
  if(dp<=-20) return '<span class="ichip dn">▼'+(-dp)+'%</span>';
  return '';
}
/* Everyday = what her month normally costs: under RM 1,000 and not an
   installment part (Wealth OS reassembles those into the whole purchase,
   so a RM 350/mo laser plan isn't lifestyle there either). The trend is
   read on everyday only; one-offs and installments are listed, not stacked,
   so one big buy can't hide which way the ordinary months are going. */
function isEveryday(e){ return e.amt<ONE_OFF && !e.inst; }
function trendHtml(){
  function sum(a,e){return a+e.amt;}
  function avgOf(a){ return a.length?a.reduce(function(s,v){return s+v;},0)/a.length:0; }
  var now=new Date(), day=now.getDate(), dim=new Date(now.getFullYear(),now.getMonth()+1,0).getDate(), months=[];
  for(var i=11;i>=0;i--){ var d=new Date(now.getFullYear(),now.getMonth()-i,1); months.push({k:ymKey(d),d:d}); }
  var past=entries.filter(function(e){return new Date(e.ts).getTime()<=now.getTime();});
  var firstK=past.reduce(function(m,e){var k=entryMonth(e);return (!m||k<m)?k:m;},null)||monthKey;
  months=months.filter(function(m){return m.k>=firstK;});
  months.forEach(function(m){
    var mo=monthOf(m.k), ev=mo.filter(isEveryday), mdim=new Date(m.d.getFullYear(),m.d.getMonth()+1,0).getDate();
    m.life=ev.reduce(sum,0);
    m.toDay=ev.filter(function(e){return +entryDay(e).slice(8,10)<=Math.min(day,mdim);}).reduce(sum,0);
    m.big=mo.filter(function(e){return !isEveryday(e);});
    m.tot=mo.reduce(sum,0); m.need=mo.filter(function(e){return e.need==='need';}).reduce(sum,0);
    m.cur=m.k===monthKey;
  });
  function mName(m,long){return m.d.toLocaleDateString('en-GB',{month:long?'long':'short'});}
  var closed=months.filter(function(m){return !m.cur;}), cur=months.filter(function(m){return m.cur;})[0];
  var last=closed[closed.length-1], before=closed.slice(-7,-1);
  var usual=avgOf(closed.slice(-6).map(function(m){return m.life;}));

  /* The verdict, in words. Last full month against the months before it
     (not an average that already contains it), then this month against
     what she has usually spent by the same day — fair on day 6, no guessing. */
  var head, sub='';
  if(!last||!before.length){
    head='Not enough full months yet to call a trend.';
  } else {
    var base=avgOf(before.map(function(m){return m.life;})), dp=base?Math.round((last.life-base)/base*100):0;
    var word=dp>=8?'<b class="up">up '+dp+'%</b>':dp<=-8?'<b class="dn">down '+(-dp)+'%</b>':'<b>steady</b>';
    head='Everyday spending is '+word+'.';
    sub=mName(last,true)+' RM '+fmt(last.life)+' vs RM '+fmt(base)+' a month before'+(before.length>1?' ('+before.length+'-mo avg)':'')+'.';
  }
  var pace='';
  if(cur&&closed.length){
    var by=avgOf(closed.slice(-6).map(function(m){return m.toDay;})), pd=by?Math.round((cur.life-by)/by*100):0;
    var pw=pd>=15?'<b class="up">ahead of usual</b>':pd<=-15?'<b class="dn">under usual</b>':'<b>on track</b>';
    pace='<div class="vpace"><span>'+mName(cur,true)+' everyday so far</span><b class="num">RM '+fmt(cur.life)+'</b>'+
      '<small>usually RM '+fmt(by)+' by day '+day+' · '+pw+'</small></div>';
  }
  var verdict='<div class="verdict"><div class="vhead">'+head+'</div>'+(sub?'<div class="vsub">'+sub+'</div>':'')+pace+'</div>';

  /* Everyday bars only, with full month names; this month shows what's
     spent so far inside a dashed outline of the usual month. */
  var max=Math.max(usual,1); months.forEach(function(m){ if(m.life>max) max=m.life; });
  var H=140;

  var g=cfg.cats[+inp.dataset.i], isSub=inp.dataset.t==='sub', f=inp.dataset.f;
  var node=isSub?g.subs[+inp.dataset.j]:g, val=inp.value.trim();

    var clash=isSub?findSub(g,val):findGroup(val);
    if(clash&&clash!==node){ toast(val+' already exists'); inp.value=node.n; return; }
    var old=node.n, now=Date.now(), moved=0;

    if(!isSub&&cfg.limits&&cfg.limits[old]!=null){ cfg.limits[val]=cfg.limits[old]; delete cfg.limits[old]; }
    if(moved){ save(KEY,entries); toast('Moved '+moved+' entr'+(moved===1?'y':'ies')+' to '+val); }
  } else node.e=val||'•';

function planKey(e){
  if(e.inst&&e.inst.g) return 'g:'+e.inst.g;
  var m=String(e.note||'').match(/^(.*?)\s*(\d+)\/(\d+)\s*$/);
  if(m&&+m[3]>=2&&+m[2]<=+m[3]) return 'n:'+m[1].trim().toLowerCase()+'|'+e.cat+'|'+m[3];
  return null;
}

   split ahead (future-dated parts exist) or logged month by month as she

   and are worked out from the numbering, at the last part's amount. */
function planRow(p){

    (p.est?' · not all logged yet':'')+'</small></div></div><div class="l"><b class="num">RM '+fmt(p.left)+'</b></div></div>';
}
function partNo(e){
  if(e.inst&&e.inst.i) return {i:+e.inst.i,n:+e.inst.n};
  var m=String(e.note||'').match(/(\d+)\/(\d+)\s*$/);
  return m?{i:+m[1],n:+m[2]}:null;
}
function addMonthsTs(ts,n){ var d=new Date(ts), x=new Date(d.getTime()), day=d.getDate(); x.setDate(1); x.setMonth(x.getMonth()+n); x.setDate(Math.min(day,new Date(x.getFullYear(),x.getMonth()+1,0).getDate())); return x; }
function activePlans(){
  var now=Date.now(), groups={};
  entries.forEach(function(e){ var k=planKey(e); if(k) (groups[k]=groups[k]||[]).push(e); });
  return Object.keys(groups).map(function(k){
    var parts=groups[k].slice().sort(function(a,b){return a.ts<b.ts?-1:1;});
    var n=0, hi=0; parts.forEach(function(e){ var p=partNo(e); if(p){ n=Math.max(n,p.n); hi=Math.max(hi,p.i); } });
    var fut=parts.filter(function(e){return new Date(e.ts).getTime()>now;});
    var last=parts[parts.length-1], per=last.amt;
    var unlogged=Math.max(0,n-hi);                 // parts not in the app yet
    var left=fut.reduce(function(a,e){return a+e.amt;},0)+unlogged*per;
    var next=fut.length?new Date(fut[0].ts):(unlogged?addMonthsTs(last.ts,1):null);
    var paid=parts.length-fut.length;
    return {key:k, desc:planDesc(last), e:last, parts:parts, n:n||parts.length, paid:paid, leftN:fut.length+unlogged,
      left:left, per:per, next:next, est:unlogged>0, first:fut[0]||last};
  }).filter(function(p){ return p.leftN>0&&p.parts.length>=1&&(p.parts.length>1||p.n>1); })
    .sort(function(a,b){ return (a.next||0)-(b.next||0); });
}

  return entries.filter(function(e){
    var g=findGroup(e.cat);
    if(!(g&&g.subs.length&&!e.sub)) return false;
    var k=planKey(e); if(!k) return true;
    if(seen[k]) return false; seen[k]=1; return true; // one row per installment plan
  }).sort(function(a,b){return a.ts<b.ts?1:-1;});
}
function refileHtml(){
  var list=refileList();
  var rows=list.slice(0,150).map(function(e){
    var d=new Date(e.ts);
    var parts=planParts(e);
    if(parts.length>1){
      var tot=parts.reduce(function(a,x){return a+x.amt;},0);
      return '<div class="row rowc" onclick="openEdit(\''+e.id+'\')"><div class="l"><span class="e">'+e.e+'</span><div>'+esc(planDesc(e))+' <span class="ichip">installment</span>'+
        '<small>'+parts.length+' parts · '+esc(catLabel(e))+'</small></div></div>'+
        '<div class="l"><b class="num">RM '+fmt(tot)+'</b></div></div>';
    }
    return '<div class="row rowc" onclick="openEdit(\''+e.id+'\')"><div class="l"><span class="e">'+e.e+'</span><div>'+esc(e.note||catLabel(e))+
      '<small>'+d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'2-digit'})+' · '+esc(catLabel(e))+'</small></div></div>'+
      '<div class="l"><b class="num">RM '+fmt(e.amt)+'</b></div></div>';
  }).join('') || '<div class="mini">All filed ✨</div>';
  return '<h2>Re-file <span>'+list.length+'</span><button class="x back" onclick="openSheet(\'set\')">‹ Back</button></h2>'+
    '<div class="mini" style="text-align:left;margin:0 0 6px">Tap one, pick its real category, Save. It drops off this list.</div>'+rows;
}

function backupFile(){

     and leave the GitHub token/passphrase out — this file gets AirDropped
     and emailed around, and the connection is re-entered per device anyway. */

/* ---- GitHub Gist cloud sync ---- */
var GIST_FILE='spend-data.json';
var MAKAN_FILE='makan-data.json';
var syncT=null, syncing=false, pushAgain=false, lastPull=0;
function setCloud(st){
  var el=document.getElementById('cloud');
  el.textContent = st==='ok'?'☁️' : st==='pending'?'⏳' : st==='err'?'⚠️' : '';
}
function ghReq(method,url,body,cb){
  fetch(url,{method:method,headers:{
    'Authorization':'Bearer '+cfg.ghToken,
    'Accept':'application/vnd.github+json',
    'Content-Type':'application/json'
  },body:body?JSON.stringify(body):undefined})
  .then(function(r){if(!r.ok)throw new Error('GitHub '+r.status);return r.json();})
  .then(function(j){cb(null,j);},function(e){cb(e);});
}
function syncPayload(){
  var c={};for(var k in cfg){if(k!=='ghToken'&&k!=='gistId'&&k!=='syncPass')c[k]=cfg[k];}
  return JSON.stringify({v:1,savedAt:new Date().toISOString(),entries:entries,cfg:c,del:deleted});
}
/* passphrase encryption: AES-GCM, key from PBKDF2(passphrase) */
function b64(buf){var s='';new Uint8Array(buf).forEach(function(x){s+=String.fromCharCode(x);});return btoa(s);}
function unb64(s){var bin=atob(s),a=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a;}
function deriveKey(pass,salt){
  return crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey'])
    .then(function(km){return crypto.subtle.deriveKey(
      {name:'PBKDF2',salt:salt,iterations:150000,hash:'SHA-256'},km,
      {name:'AES-GCM',length:256},false,['encrypt','decrypt']);});
}
function encryptPayload(txt,pass){
  var salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  return deriveKey(pass,salt).then(function(key){
    return crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,new TextEncoder().encode(txt));
  }).then(function(ct){
    return JSON.stringify({v:2,enc:true,salt:b64(salt),iv:b64(iv),data:b64(ct)});
  });
}
function decryptPayload(obj,pass){
  return deriveKey(pass,unb64(obj.salt)).then(function(key){
    return crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(obj.iv)},key,unb64(obj.data));
  }).then(function(pt){return new TextDecoder().decode(pt);});
}
function buildPayload(cb,interactive){
  var txt=syncPayload();
  if(cfg.syncPass)encryptPayload(txt,cfg.syncPass).then(cb,function(){syncing=false;syncFail(new Error('encrypt'),interactive);});
  else cb(txt);
}
function syncFail(err,interactive){
  if(/401|403/.test(err&&err.message)){ // dead token: forget it so Settings shows the paste field again
    cfg.ghToken='';save(CKEY,cfg,true);setCloud('');
    toast('Token rejected — paste a new one in ⚙');
  } else {
    setCloud('err');
    if(interactive)toast('Sync failed — offline?');
  }
}
/* Every upload reads the cloud copy first (2026-10-09). The upload is the
   whole list, so pushing without pulling dropped anything another device
   had added since — the Mac's menu-bar quick-log above all. pullSync merges
   (adds theirs, keeps ours, honours deletions) and then pushes the result. */
function schedSync(){
  if(!cfg.ghToken)return;
  clearTimeout(syncT);setCloud('pending');
  syncT=setTimeout(function(){pullSync();},1800);
}
function pushSync(interactive){
  if(!cfg.ghToken)return;
  if(syncing){pushAgain=true;return;} // one in flight: go again when it lands
  syncing=true;
  buildPayload(function(content){
    var files={};files[GIST_FILE]={content:content};
    function done(err,j){
      syncing=false;
      if(pushAgain){pushAgain=false;schedSync();}
      if(err){syncFail(err,interactive);return;}
      if(j&&j.id&&cfg.gistId!==j.id){cfg.gistId=j.id;}
      cfg.lastSync=Date.now();save(CKEY,cfg,true);setCloud('ok');
      if(interactive)toast('Backed up to cloud ☁️');
    }
    if(cfg.gistId){
      ghReq('PATCH','https://api.github.com/gists/'+cfg.gistId,{files:files},function(err,j){
        if(err&&/404/.test(err.message)){cfg.gistId='';syncing=false;pushSync(interactive);}
        else done(err,j);
      });
    } else {
      ghReq('POST','https://api.github.com/gists',
        {description:'Spend tracker sync (auto-backup)',public:false,files:files},done);
    }
  },interactive);
}
function pullSync(interactive){
  if(!cfg.ghToken)return;
  lastPull=Date.now();
  setCloud('pending');
  if(cfg.gistId)fetchGist(interactive);else findGist(interactive);
}
function findGist(interactive){
  ghReq('GET','https://api.github.com/gists?per_page=100',null,function(err,list){
    if(err){syncFail(err,interactive);return;}
    var g=null;
    (list||[]).some(function(x){if(x.files&&x.files[GIST_FILE]){g=x;return true;}return false;});
    if(g){cfg.gistId=g.id;save(CKEY,cfg,true);fetchGist(interactive);}
    else pushSync(interactive); // nothing in the cloud yet: first upload
  });
}
function fetchGist(interactive){
  ghReq('GET','https://api.github.com/gists/'+cfg.gistId,null,function(err,j){
    if(err){
      if(/404/.test(err.message)){cfg.gistId='';save(CKEY,cfg,true);findGist(interactive);}
      else syncFail(err,interactive);
      return;
    }
    var f=j.files&&j.files[GIST_FILE];
    if(!f){pushSync(interactive);return;}
    if(f.truncated)fetch(f.raw_url).then(function(r){return r.text();})
      .then(function(t){mergeRemote(t,interactive);},function(e){syncFail(e,interactive);});
    else mergeRemote(f.content,interactive);
  });
}
function mergeRemote(txt,interactive){
  var data=null;try{data=JSON.parse(txt);}catch(e){}
  if(data&&data.enc){
    if(!cfg.syncPass){setCloud('err');toast('Cloud copy is encrypted — connect with your passphrase');return;}
    decryptPayload(data,cfg.syncPass).then(function(pt){
      var d=null;try{d=JSON.parse(pt);}catch(e){}
      applyRemote(d,interactive);
    },function(){ // wrong passphrase: reset so Settings shows the connect fields again
      cfg.ghToken='';cfg.syncPass='';cfg.gistId='';save(CKEY,cfg,true);
      setCloud('');toast('Wrong passphrase — nothing restored, reconnect in ⚙');
    });
    return;
  }
  applyRemote(data,interactive);
}
function applyRemote(data,interactive){
  if(!data||!data.entries){pushSync(interactive);return;}

  /* Deletions travel as tombstones: adopt the other device's, drop anything
     it buried, and don't re-add what this device already buried. */
  var tombK={}, tombI={}, tombNew=false;
  function noteTomb(d){
    if(!d||!d.k) return false;
    if(d.k in tombK) return false;
    tombK[d.k]=d.t||0; if(d.id) tombI[d.id]=d.t||0;
    return true;
  }
  deleted.forEach(noteTomb);
  (data.del||[]).forEach(function(d){
    if(noteTomb(d)){ deleted.push({k:d.k,id:d.id||null,t:d.t||Date.now()}); tombNew=true; }
  });
  if(tombNew){ tombPrune(); save(DKEY,deleted,true); }
  var before=entries.length;
  entries=entries.filter(function(e){ return !isTombed(e,tombK,tombI); });
  var removed=before-entries.length;

  /* Match on the entry's own id, falling back to date+amount for rows that
     predate ids (each device generated those separately, so the ids differ
     for what is really the same purchase). Newer edit wins — that's what
     lets a changed category or note reach the other device at all. */
  var byId={}, byKey={};
  entries.forEach(function(e,i){ if(e.id) byId[e.id]=i; byKey[entryKey(e)]=i; });
  var added=0, updated=0;
  data.entries.forEach(function(r){
    if(!r||!r.ts||!(parseFloat(r.amt)>0))return;
    if(isTombed(r,tombK,tombI))return;
    var idx=(r.id&&byId[r.id]!=null)?byId[r.id]:byKey[entryKey(r)];
    if(idx==null){
      if(!r.id)r.id=genId();
      byId[r.id]=entries.length; byKey[entryKey(r)]=entries.length;
      entries.push(r); added++;
    } else if((r.u||0)>(entries[idx].u||0)){
      r.id=entries[idx].id||r.id||genId();  // keep the id this device already knows
      entries[idx]=r; updated++;
    }
  });
  if(added||removed||updated){entries.sort(function(a,b){return a.ts<b.ts?-1:1;});save(KEY,entries,true);}
  /* Settings used to be adopted only by a device with no entries, which is
     why a laptop that logged anything before connecting kept its factory
     categories for good. Take whichever copy was edited more recently
     instead — a device with nothing yet has no stamp, so it still adopts. */
  var cfgNewer=data.cfg&&data.cfg.cats&&data.cfg.methods&&data.cfg.methods.length&&
               (data.cfg.u||0)>(cfg.u||0);
  if(cfgNewer){
    var tok=cfg.ghToken,gid=cfg.gistId,pw=cfg.syncPass;
    cfg=data.cfg;cfg.ghToken=tok;cfg.gistId=gid;cfg.syncPass=pw;
    if(cfg.methods.indexOf(cfg.method)<0)cfg.method=cfg.methods[0];
    save(CKEY,cfg,true);
    renderMethods();renderNeed();
  }
  /* Anything from a device still on the flat categories gets refiled on
     arrival — settings and rows both. */
  if(cfgNewer||added||updated){ migrateCats(); syncCatIcons(); openGroup=null; renderCats(); }
  renderTotals();
  if(!interactive&&added) toast('☁️ '+added+' new from your other devices');
  if(interactive){
    var bits=[];
    if(added) bits.push('restored '+added+' entr'+(added===1?'y':'ies'));
    if(updated) bits.push('updated '+updated);
    if(removed) bits.push('removed '+removed+' deleted elsewhere');
    if(cfgNewer) bits.push('settings updated');
    toast(bits.length?('☁️ '+bits.join(' · ')):'☁️ Connected — up to date');
  }
  pushSync(); // push the merged state back up
}
/* ---- Restore from cloud history ---------------------------------------
   GitHub keeps every version of the synced gist. If entries go missing on
   this phone (a bad import, a storage wipe that synced), pick a day from
   before it happened and add back whatever that version has that this
   phone doesn't. It only ever adds — nothing here is removed — and it
   overrides the delete-markers for exactly those entries, since bringing
   them back is the point. -------------------------------------------- */
var hist=null;
function histLoad(){
  if(!cfg.ghToken||!cfg.gistId){ toast('Connect cloud sync first'); return; }
  hist={loading:true,days:[],sel:null}; openSheet('hist');
  var all=[], cut=Date.now()-60*864e5;
  (function page(n){
    ghReq('GET','https://api.github.com/gists/'+cfg.gistId+'/commits?per_page=100&page='+n,null,function(err,list){
      if(err){ hist.loading=false; hist.err='Couldn\'t reach GitHub — '+err.message; if(currentSheet==='hist') openSheet('hist'); return; }
      all=all.concat(list||[]);
      var oldest=all.length?new Date(all[all.length-1].committed_at).getTime():0;
      if((list||[]).length===100&&n<20&&oldest>cut) return page(n+1);
      var byDay={};
      all.forEach(function(c){
        var k=dKey(new Date(c.committed_at));
        if(!byDay[k]) byDay[k]={day:k,version:c.version,at:c.committed_at,n:0};
        byDay[k].n++;
      });
      hist.days=Object.keys(byDay).sort().reverse().map(function(k){return byDay[k];});
      hist.loading=false;
      if(currentSheet==='hist') openSheet('hist');
    });
  })(1);
}
function histOpen(version){
  hist.sel={version:version,loading:true}; openSheet('hist');
  ghReq('GET','https://api.github.com/gists/'+cfg.gistId+'/'+version,null,function(err,j){
    if(err){ hist.sel.err=err.message; hist.sel.loading=false; openSheet('hist'); return; }
    var f=j.files&&j.files[GIST_FILE];
    if(!f){ hist.sel.err='No Spend data in that version'; hist.sel.loading=false; openSheet('hist'); return; }
    var got=function(txt){
      var data=null; try{data=JSON.parse(txt);}catch(e){}
      var fin=function(d){
        if(!d||!d.entries){ hist.sel.err='Couldn\'t read that version'; hist.sel.loading=false; openSheet('hist'); return; }
        var byId={}, byKey={};
        entries.forEach(function(e){ if(e.id) byId[e.id]=1; byKey[entryKey(e)]=1; });
        var missing=d.entries.filter(function(r){ return r&&r.ts&&parseFloat(r.amt)>0&&!(r.id&&byId[r.id])&&!byKey[entryKey(r)]; });
        var months={}; d.entries.forEach(function(r){ var k=entryMonth(r); months[k]=(months[k]||0)+1; });
        hist.sel={version:version,loading:false,total:d.entries.length,missing:missing,months:months};
        openSheet('hist');
      };
      if(data&&data.enc){
        if(!cfg.syncPass){ hist.sel.err='That version is encrypted — reconnect with your passphrase'; hist.sel.loading=false; openSheet('hist'); return; }
        decryptPayload(data,cfg.syncPass).then(function(pt){ var d=null; try{d=JSON.parse(pt);}catch(e){} fin(d); },
          function(){ hist.sel.err='Passphrase doesn\'t open that version'; hist.sel.loading=false; openSheet('hist'); });
      } else fin(data);
    };
    if(f.truncated) fetch(f.raw_url).then(function(r){return r.text();}).then(got,function(e){ hist.sel.err=e.message; hist.sel.loading=false; openSheet('hist'); });
    else got(f.content);
  });
}
function histRestore(){
  var m=hist&&hist.sel&&hist.sel.missing; if(!m||!m.length) return;
  if(!confirm('Add back '+m.length+' entr'+(m.length===1?'y':'ies')+' from that version?\n\nNothing on this phone is removed.')) return;
  var ids={}; m.forEach(function(r){ if(r.id) ids[r.id]=1; });
  var keys={}; m.forEach(function(r){ keys[entryKey(r)]=1; });
  deleted=deleted.filter(function(d){ return !(d.k in keys)&&!(d.id&&ids[d.id]); });
  save(DKEY,deleted,true);
  m.forEach(function(r){ var x=JSON.parse(JSON.stringify(r)); if(!x.id) x.id=genId(); x.u=Date.now(); entries.push(x); });
  entries.sort(function(a,b){return a.ts<b.ts?-1:1;});
  migrateCats(); syncCatIcons();
  save(KEY,entries); // pushes, so the cloud copy has them again too
  renderTotals(); renderCats();
  toast('Restored '+m.length+' entr'+(m.length===1?'y':'ies'));
  histOpen(hist.sel.version);
}
function histHtml(){
  var h='<h2>Cloud history<button class="x back" onclick="openSheet(\'set\')">‹ Back</button></h2>'+
    '<div class="mini" style="text-align:left;margin:0 0 8px">Every sync is kept. Pick a day from <b>before</b> things went missing — you\'ll see what it has, then add back only what this phone is missing. Nothing gets deleted.</div>';
  if(!hist||hist.loading) return h+'<div class="mini">Loading versions…</div>';
  if(hist.err) return h+'<div class="mini">'+esc(hist.err)+'</div>';
  if(hist.sel){
    var s=hist.sel;
    h+='<div class="ihero" style="text-align:left">';
    if(s.loading) h+='<div class="iline">Opening that version…</div>';
    else if(s.err) h+='<div class="iline">'+esc(s.err)+'</div>';
    else{
      var mk=Object.keys(s.months).filter(function(k){return k<=monthKey;}).sort().reverse().slice(0,4).map(function(k){return new Date(k+'-01T00:00:00').toLocaleDateString('en-GB',{month:'short'})+' '+s.months[k];}).join(' · ');
      h+='<div class="iline"><b>'+s.total+' entries</b> in that version · '+mk+'</div>'+
        (s.missing.length?'<div class="iline" style="margin-top:6px"><b>'+s.missing.length+'</b> of them are missing on this phone</div>'+
          '<button class="copybtn" onclick="histRestore()">Add back '+s.missing.length+' entr'+(s.missing.length===1?'y':'ies')+'</button>'
          :'<div class="iline" style="margin-top:6px">This phone already has everything in it ✓</div>');
    }
    h+='</div>';
  }
  return h+'<div class="bdh">Saved versions · newest first</div>'+(hist.days.map(function(d){
    var t=new Date(d.at);
    return '<div class="row rowc'+(hist.sel&&hist.sel.version===d.version?' on':'')+'" onclick="histOpen(\''+d.version+'\')"><div class="l">'+
      t.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})+
      '<small style="margin-left:6px">last save '+t.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})+' · '+d.n+' sync'+(d.n===1?'':'s')+'</small></div><b>›</b></div>';
  }).join('')||'<div class="mini">No versions found.</div>');
}
window.histLoad=histLoad;window.histOpen=histOpen;window.histRestore=histRestore;

/* ---- ✦ Glance (2026-10-09) ---------------------------------------------
   The suite (Allocation OS, Wealth OS) only runs on her laptop. The Mac's
   menu-bar app copies its glance into a private gist of its own —
   glance-data.json, encrypted with this app's passphrase — and this sheet
   reads it: days to FI, investments vs the S&P 500, what's left to invest,
   Needs You. Money is blurred until tapped.
   The other way: a wish or a top-up added here is appended to that gist's
   glance-inbox.json; the Mac forwards each one once to Wishlist / Allocation
   OS. Only this side writes that file (the Mac just remembers ids), and it
   prunes its own items after 14 days. -------------------------------------- */
var GLANCE_FILE='glance-data.json', GLANCE_INBOX='glance-inbox.json', GLKEY='xpense_glance_v1';
var gl=(function(){ var c=null; try{ c=JSON.parse(localStorage.getItem(GLKEY)||'null'); }catch(e){}
  return {gistId:c&&c.gistId||'', data:c&&c.data||null, loading:false, err:'', add:'wish', reveal:false, sending:false}; })();
function glanceSave(){ try{ localStorage.setItem(GLKEY,JSON.stringify({gistId:gl.gistId,data:gl.data})); }catch(e){} }
function glanceRedraw(){ if(currentSheet==='glance'&&document.getElementById('sheet').classList.contains('open')) openSheet('glance'); }
function glanceOpen(){ openSheet('glance'); glanceLoad(); }
function glanceRead(f,cb){
  function parse(t){
    var o=null; try{o=JSON.parse(t);}catch(e){}
    if(!o){cb(new Error('unreadable'));return;}
    if(!o.enc){cb(null,o);return;}
    decryptPayload(o,cfg.syncPass).then(function(pt){ var d=null; try{d=JSON.parse(pt);}catch(e){} cb(d?null:new Error('unreadable'),d); },
      function(){cb(new Error('passphrase'));});
  }
  if(f.truncated) fetch(f.raw_url).then(function(r){return r.text();}).then(parse,function(e){cb(e);});
  else parse(f.content||'');
}
function glanceGist(cb,retry){
  function get(){
    ghReq('GET','https://api.github.com/gists/'+gl.gistId,null,function(err,j){
      if(err&&/404/.test(err.message)&&!retry){ gl.gistId=''; glanceSave(); glanceGist(cb,true); return; }
      cb(err,j&&j.files);
    });
  }
  if(gl.gistId){get();return;}
  ghReq('GET','https://api.github.com/gists?per_page=100',null,function(err,list){
    if(err){cb(err);return;}
    var g=(list||[]).filter(function(x){return x.files&&x.files[GLANCE_FILE];})[0];
    if(!g){cb(new Error('none'));return;}
    gl.gistId=g.id; glanceSave(); get();
  });
}
function glanceLoad(){
  if(!cfg.ghToken||!cfg.syncPass){ gl.err='Connect cloud sync with your passphrase in ⚙ first.'; glanceRedraw(); return; }
  gl.loading=true; gl.err=''; glanceRedraw();
  glanceGist(function(err,files){
    if(err){ gl.loading=false; gl.err=/none/.test(err.message)?'Nothing from your Mac yet — Glance on the Mac creates this once it\'s connected to Spend.':'Couldn\'t reach the cloud — offline?'; glanceRedraw(); return; }

function glanceSend(){
  if(gl.sending) return;
  function val(id){ var e=document.getElementById(id); return e?e.value.trim():''; }
  var name=val('glName'), amt=parseFloat(val('glAmt').replace(/[^\d.]/g,'')), link=val('glLink'), note=val('glNote');
  if(!name){ toast(gl.add==='wish'?'Name the thing first':'Which name?'); return; }
  if(!(amt>0)){ toast('Enter an amount first'); return; }
  if(!cfg.ghToken||!cfg.syncPass){ toast('Connect cloud sync in ⚙ first'); return; }
  var item={id:'ph-'+genId(), kind:gl.add, at:new Date().toISOString()};
  if(gl.add==='wish'){ item.name=name; item.price=amt; if(link) item.link=link; } else { item.ticker=name; item.rm=amt; }
  if(note) item.note=note;
  /* the button says it's working; no redraw, so a failed send keeps what she typed */
  var btn=document.querySelector('#sheetBody .copybtn:last-of-type');
  gl.sending=true; if(btn) btn.textContent='Sending…';
  function fail(){ gl.sending=false; if(btn) btn.textContent='Send to my Mac'; toast('Couldn\'t send — offline?'); }
  glanceGist(function(err,files){
    if(err){ fail(); return; }
    function append(inbox){
      var cut=Date.now()-14*864e5, items=((inbox&&inbox.items)||[]).filter(function(x){ return Date.parse(x.at)>cut; });
      items.push(item);
      encryptPayload(JSON.stringify({items:items}),cfg.syncPass).then(function(content){
        var fl={}; fl[GLANCE_INBOX]={content:content};
        ghReq('PATCH','https://api.github.com/gists/'+gl.gistId,{files:fl},function(e){
          if(e){ fail(); return; }
          gl.sending=false; glanceRedraw();
          toast(gl.add==='wish'?'✦ Sent — Wishlist adds it':'✦ Sent — waiting in AOS Needs You');
        });
      },fail);
    }
    var f=files&&files[GLANCE_INBOX];
    if(!f){ append(null); return; }
    glanceRead(f,function(e,d){ if(e){ fail(); return; } append(d); });
  });
}
