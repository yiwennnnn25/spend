}
function syncStatus(){
  var lock=cfg.syncPass?' · 🔒 encrypted':'';
  if(!cfg.lastSync)return 'Connected — first sync pending'+lock;
  var m=Math.round((Date.now()-cfg.lastSync)/60000);
  return 'Last synced '+(m<1?'just now':m<60?m+' min ago':Math.round(m/60)+' h ago')+lock;
}
function csvFields(line){
  var f=[],cur='',q=false;
  for(var i=0;i<line.length;i++){
    var c=line[i];
    if(q){ if(c==='"'){ if(line[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===','){ f.push(cur);cur=''; }
    else cur+=c;
  }
  f.push(cur);return f;
}
function parseCsv(txt){
  var lines=txt.split(/\r?\n/), out=[];
  var start=(lines[0]||'').toLowerCase().indexOf('date')===0?1:0;
  for(var i=start;i<lines.length;i++){
    if(!lines[i])continue;
    var f=csvFields(lines[i]); if(f.length<2)continue;
    var row={ts:f[0],amt:f[1],cat:f[2],method:f[3],need:f[4],note:f[5]};
    // a 7th column is the sub; "Food > GrabFood" in the category column works too
    var cs=String(f[2]||'').split(/\s*[>›\/]\s*/);
    if(f[6]) row.sub=f[6]; else if(cs.length===2&&cs[0]&&cs[1]){ row.cat=cs[0]; row.sub=cs[1]; }
    out.push(row);
  }
  return out;
}
function doImport(txt,replace){
  txt=(txt||'').trim();
  var incoming=null, newCfg=null, newDel=null;
  if(txt[0]==='{'||txt[0]==='['){
    try{var j=JSON.parse(txt);incoming=Array.isArray(j)?j:j.entries;if(j.cfg)newCfg=j.cfg;if(j.del)newDel=j.del;}catch(err){}
  } else if(txt){
    incoming=parseCsv(txt);
  }
  if(!incoming||!incoming.length){toast('Nothing to import');return;}
  var catE={};cfg.cats.forEach(function(c){catE[c.n]=c.e;});
  if(newCfg&&newCfg.cats)newCfg.cats.forEach(function(c){catE[c.n]=c.e;});

  /* Replace mode: the file is the truth, not a contribution to merge into
     what's here. The cloud already carries entries between devices, so the
     job left for a file is making a device that drifted match exactly —
     which a merge can never do, since a merge only ever adds. */
  if(replace){
    if(!confirm('Replace everything on this device?\n\n'+
        entries.length+' entr'+(entries.length===1?'y':'ies')+' here will be discarded and replaced with '+
        incoming.length+' from the file.\n\nThe cloud copy updates to match on the next sync.')) return;
    entries=[];
    if(newDel){ deleted=newDel.slice(); tombPrune(); save(DKEY,deleted,true); }
  }

  /* A backup carries what the other device deleted, so importing one can
     finally remove — not just add. This is what lets a device that fell
     behind catch up completely instead of hoarding entries forever. */
  var tomb={}; deleted.forEach(function(d){ tomb[d.k]=d.t||0; });
  var tombNew=false;
  (newDel||[]).forEach(function(d){
    if(!d||!d.k) return;
    if(tomb[d.k]==null){ deleted.push({k:d.k,t:d.t||Date.now()}); tomb[d.k]=d.t||Date.now(); tombNew=true; }
  });
  if(tombNew){ tombPrune(); save(DKEY,deleted,true); }
  var beforeN=entries.length;
  entries=entries.filter(function(e){ return !(entryKey(e) in tomb); });
  var removed=beforeN-entries.length;

  var seen={};entries.forEach(function(e){seen[e.ts+'|'+e.amt]=1;});
  var added=0;
  incoming.forEach(function(e){
    if(!e)return;
    var v=parseFloat(e.amt), ts=e.ts;
    if(!ts||isNaN(new Date(ts).getTime())||!(v>0))return;
    var k=ts+'|'+v; if(seen[k]||(k in tomb))return; seen[k]=1;
    var row={id:e.id||genId(),amt:v,cat:e.cat||'Others',e:e.e||catE[e.cat]||'📌',method:e.method||'',
      need:e.need==='need'?'need':'want',note:e.note||'',ts:ts,u:e.u||Date.now()};
    if(e.sub) row.sub=e.sub;
    if(e.inst&&e.inst.g) row.inst=e.inst; // keep installment tags across a backup restore
    if(e.fx&&e.fx.c) row.fx=e.fx;
    if(e.trip) row.trip=e.trip;
    if(e.tag) row.tag=e.tag;
    entries.push(row);
    added++;
  });
  entries.sort(function(a,b){return a.ts<b.ts?-1:1;});
  save(KEY,entries);
  if(newCfg&&newCfg.cats&&newCfg.methods&&newCfg.methods.length){
    /* Adopt the settings but keep this device's own cloud connection —
       a backup from another phone must not unplug the one you're holding. */
    var tok=cfg.ghToken,gid=cfg.gistId,pw=cfg.syncPass;
    cfg=newCfg;
    cfg.ghToken=newCfg.ghToken||tok; cfg.gistId=newCfg.gistId||gid; cfg.syncPass=newCfg.syncPass||pw;
    if(cfg.methods.indexOf(cfg.method)<0)cfg.method=cfg.methods[0];
    save(CKEY,cfg);renderMethods();renderNeed();
  }
  migrateCats(); syncCatIcons(); openGroup=null; pending=null; renderPend(); renderCats();
  renderTotals();closeSheet();
  if(replace){ toast('Replaced — '+added+' entr'+(added===1?'y':'ies')+' now on this device'); return; }
  var bits=[];
  if(added) bits.push('imported '+added+' entr'+(added===1?'y':'ies'));
  if(removed) bits.push('removed '+removed+' deleted elsewhere');
  toast(bits.length?(bits.join(' · ').replace(/^./,function(c){return c.toUpperCase();}))
                   :'No new entries — all duplicates');
}

// Home-Screen web apps cache the HTML hard and won't show a new deploy on their
// own. On each load (when online) fetch the live copy bypassing cache, and if its
// version marker differs, offer a one-tap reload. Purely advisory — can't brick
// the app, and does nothing offline.
function checkUpdate(){
  if(navigator.onLine===false) return;
  fetch(location.pathname+'?_='+Date.now(),{cache:'no-store'})
    .then(function(r){return r.ok?r.text():null;})
    .then(function(t){
      if(!t) return;
      var m=t.match(/APPVER:([0-9a-z-]+)/);
      if(m&&m[1]&&m[1]!==APP_VERSION) showUpdateBanner(m[1]);
    }).catch(function(){});
}
/* A Home Screen app mostly resumes from the background instead of
   starting, so checking only at start meant she never saw a new version.
   Check again whenever it comes back to the front (at most every 10 min). */
var lastUpdCheck=0;
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='visible'&&Date.now()-lastUpdCheck>600e3){ lastUpdCheck=Date.now(); checkUpdate(); }
});
function showUpdateBanner(v){
  if(document.getElementById('upd')) return;
  var b=document.createElement('div'); b.id='upd'; b.className='upd';
  /* a plain reload can be answered from the 10-minute page cache and come
     back as the old version; a new address forces the new copy */
  b.innerHTML='<span>New version available</span>'+
    '<button onclick="location.replace(location.pathname+\'?v='+(v||Date.now())+'\')">Update</button>'+
    '<button class="updx" onclick="this.parentNode.remove()">✕</button>';
  document.body.appendChild(b);
}
setTimeout(function(){ lastUpdCheck=Date.now(); checkUpdate(); },1500);

setStep('amt');renderCur();fxAuto();renderMethods();renderNeed();renderCats();renderKeys();renderAmt();renderTotals();

// ask the browser not to evict our storage under pressure (iOS ignores, Chrome honors)
if(navigator.storage && navigator.storage.persist) navigator.storage.persist();
// backup nudge: worth protecting + no backup in 7 days + no cloud sync covering us
if(!cfg.ghToken && entries.length>=10 && (!cfg.lastBackup || Date.now()-cfg.lastBackup>7*864e5))
  document.getElementById('nudge').style.display='block';
/* Pick up what other devices (the Mac's menu bar) logged: on open, and
   whenever the app comes back to the front, at most every 2 minutes. */
if(cfg.ghToken){ setCloud('ok'); pullSync(); }
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='visible'&&cfg.ghToken&&!syncing&&Date.now()-lastPull>120e3) pullSync();
});
